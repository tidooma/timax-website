<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="refresh" content="30" />
    <title>Timax — Технические работы</title>
    <style>
      :root {
        --bg: #050507;
        --bg-2: #091424;
        --panel: rgba(11, 18, 28, 0.7);
        --blue: #60a5fa;
        --blue-strong: #3b82f6;
        --blue-soft: rgba(96, 165, 250, 0.18);
        --text: #f8fbff;
        --muted: rgba(226, 232, 240, 0.85);
        --shadow: rgba(59, 130, 246, 0.4);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        background:
          radial-gradient(circle at 50% 38%, rgba(37, 99, 235, 0.12), transparent 34%),
          #020204;
      }

      body::before {
        content: "";
        position: absolute;
        inset: -20%;
        background: radial-gradient(ellipse at center, rgba(59, 130, 246, 0.09), transparent 58%);
        filter: blur(48px);
        animation: drift 22s ease-in-out infinite alternate;
      }

      @keyframes drift {
        0% { transform: translate3d(-3%, 0, 0) scale(1); }
        100% { transform: translate3d(3%, 2%, 0) scale(1.08); }
      }

      .wrap {
        position: relative;
        z-index: 1;
        width: min(900px, calc(100vw - 32px));
        text-align: center;
        padding: 32px 24px 20px;
      }

      .panel {
        position: relative;
        background: rgba(11, 18, 28, 0.68);
        border: 1px solid rgba(96, 165, 250, 0.42);
        border-radius: 28px;
        padding: 28px 20px 22px;
        box-shadow: 0 30px 60px rgba(2, 8, 17, 0.55), 0 0 0 1px rgba(96, 165, 250, 0.16), 0 0 30px rgba(59, 130, 246, 0.18);
        backdrop-filter: blur(8px);
      }

      .bear-wrap {
        position: relative;
        width: 120px;
        height: 120px;
        margin: 0 auto 18px;
      }

      .bear-glow {
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.68), rgba(96, 165, 250, 0.2) 42%, transparent 72%);
        filter: blur(26px);
        opacity: 0.9;
        animation: pulse 3s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 0.5;
          transform: scale(0.96);
        }
        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }

      .bear {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 0 24px rgba(96, 165, 250, 0.7));
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
        font-weight: 700;
      }

      p {
        margin: 18px auto 0;
        max-width: 620px;
        color: var(--muted);
        font-size: clamp(1rem, 2.3vw, 1.25rem);
        line-height: 1.6;
      }

      .estimate {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 20px;
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid rgba(96, 165, 250, 0.22);
        background: rgba(59, 130, 246, 0.08);
        color: #dbeafe;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .loader {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
      }

      .loader-ring {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3px solid rgba(96, 165, 250, 0.18);
        border-top-color: rgba(96, 165, 250, 0.95);
        animation: spin 1.1s linear infinite;
        box-shadow: 0 0 18px rgba(96,165,250,0.3);
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (max-width: 768px) {
        .panel {
          padding: 22px 16px 18px;
          border-radius: 22px;
        }

        .bear-wrap {
          width: 88px;
          height: 88px;
        }

        .estimate {
          font-size: 0.82rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <div class="bear-wrap" aria-hidden="true">
          <div class="bear-glow"></div>
          <img class="bear" src="/images/bear-logo.png" alt="Timax bear" />
        </div>

        <h1>Сайт временно недоступен</h1>
        <p>Мы обновляем сайт. Пожалуйста, зайдите немного позже.</p>
        <div class="estimate">Работаем над обновлением</div>

        <div class="loader" aria-label="Идёт обновление">
          <div class="loader-ring"></div>
        </div>

      </div>
    </div>
  </body>
</html>
