# Example Nginx config for maintenance mode.
# Put this into /etc/nginx/conf.d/timax.conf or your site block.
# It checks /var/www/timax-website/public/maintenance.flag before serving the app.

server {
    listen 80;
    listen [::]:80;
    server_name timaxxx.ru www.timaxxx.ru;

    root /var/www/timax-website/public;
    index index.html;

    location = /maintenance.flag {
        access_log off;
        log_not_found off;
        return 404;
    }

    if (-f /var/www/timax-website/public/maintenance.flag) {
        return 503;
    }

    # Serve the static maintenance page while the site is under maintenance.
    error_page 503 /maintenance.html;

    location = /maintenance.html {
        internal;
        add_header Cache-Control "no-store";
        return 503;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
